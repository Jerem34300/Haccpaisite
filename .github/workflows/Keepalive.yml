name: Keep Supabase alive

on:
  schedule:
    # Toutes les 6 heures (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: {}   # permet de le lancer à la main pour tester

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/tenants?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP $code"
          # 200 (ok) ou 401/403 (RLS bloque l'anon) comptent tous comme
          # de l'activité API — seul un 5xx ou timeout est un échec
          if [ "$code" -ge 500 ] || [ "$code" -eq 000 ]; then
            echo "Supabase semble down ou en pause" && exit 1
          fi
