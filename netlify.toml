[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/*.html"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# Clean URL redirects (removes .html extension)
[[redirects]]
  from = "/landing"
  to = "/landing.html"
  status = 200

[[redirects]]
  from = "/connexion"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/inscription"
  to = "/signup.html"
  status = 200

[[redirects]]
  from = "/guides/pms"
  to = "/guides/plan-maitrise-sanitaire.html"
  status = 200

[[redirects]]
  from = "/guides/temperatures"
  to = "/guides/temperature-haccp.html"
  status = 200

[[redirects]]
  from = "/guides/plat-temoin"
  to = "/guides/plat-temoin.html"
  status = 200

[[redirects]]
  from = "/guides/tracabilite"
  to = "/guides/tracabilite-alimentaire.html"
  status = 200

# /tarifs(.html) had no matching page (pricing lives as a #pricing anchor on
# the homepage), causing 404s. Redirect to the anchor.
[[redirects]]
  from = "/tarifs"
  to = "/#pricing"
  status = 301

[[redirects]]
  from = "/tarifs.html"
  to = "/#pricing"
  status = 301

# /account(.html) never existed as a standalone page — account/subscription
# management lives inside the dashboard (Abonnement section). Redirect there.
[[redirects]]
  from = "/account"
  to = "/dashboard.html"
  status = 301

[[redirects]]
  from = "/account.html"
  to = "/dashboard.html"
  status = 301
