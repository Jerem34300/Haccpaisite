[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/*.html"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# Pretty / short aliases. App routes stay 200 rewrites; guide aliases 301
# to the canonical .html URL (matches sitemap + rel=canonical).
[[redirects]]
  from = "/landing"
  to = "/landing.html"
  status = 200

[[redirects]]
  from = "/connexion"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/inscription"
  to = "/signup.html"
  status = 200

[[redirects]]
  from = "/guides/pms"
  to = "/guides/plan-maitrise-sanitaire.html"
  status = 301
  force = true

[[redirects]]
  from = "/guides/temperatures"
  to = "/guides/temperature-haccp.html"
  status = 301
  force = true

[[redirects]]
  from = "/guides/plat-temoin"
  to = "/guides/plat-temoin.html"
  status = 301
  force = true

[[redirects]]
  from = "/guides/tracabilite"
  to = "/guides/tracabilite-alimentaire.html"
  status = 301
  force = true

# Apex → www (belt-and-suspenders with _redirects). Primary domain in
# Netlify UI must be www.hacc.pro for a true single-hop from http://hacc.pro.
[[redirects]]
  from = "https://hacc.pro/*"
  to = "https://www.hacc.pro/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://hacc.pro/*"
  to = "https://www.hacc.pro/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.hacc.pro/*"
  to = "https://www.hacc.pro/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# /tarifs(.html) had no matching page (pricing lives as a #pricing anchor on
# the homepage), causing 404s. Redirect to the anchor.
[[redirects]]
  from = "/tarifs"
  to = "/#pricing"
  status = 301

[[redirects]]
  from = "/tarifs.html"
  to = "/#pricing"
  status = 301

# /account(.html) never existed as a standalone page — account/subscription
# management lives inside the dashboard (Abonnement section). Redirect there.
[[redirects]]
  from = "/account"
  to = "/dashboard.html"
  status = 301

[[redirects]]
  from = "/account.html"
  to = "/dashboard.html"
  status = 301
